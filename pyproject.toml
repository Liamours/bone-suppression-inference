[project]
name = "bone-suppression-inference"
version = "0.1.0"
description = "Batch bone suppression inference with Qure.ai and ResNet-BS models"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy", "opencv-python-headless", "pillow", "h5py", "pyyaml", "tqdm"]

[project.scripts]
suppress-bones = "bone_suppression_inference.run:main"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bone_suppression_inference"]
